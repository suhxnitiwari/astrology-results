<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charted · Full Report</title>
<meta name="description" content="The complete Charted report: every placement, house, aspect and technique, designed to save or print.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --paper: #fbf7f0; --ink: #1b2b30; --muted: #5d6b6c; --gold: #8a6a2c; --gold-soft: #cfa95e; --line: #1b2b3022; --night: #07161d;
    --serif: "Cormorant Garamond", Georgia, serif; --sans: "DM Sans", system-ui, sans-serif; --flow: #2a8f86; --tension: #b3526e; --blend: #9a7a2e; }
  * { box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { margin: 0; background: #2b3336; font: 11.5pt/1.62 var(--sans); color: var(--ink); }
  .g { font-family: "Segoe UI Symbol", "Apple Symbols", "Noto Sans Symbols 2", var(--serif); font-style: normal; }
  h1, h2, h3, h4 { font-family: var(--serif); font-weight: 500; margin: 0; line-height: 1.05; }
  em { font-style: italic; }

  /* toolbar (screen only) */
  .bar { position: sticky; top: 0; z-index: 5; display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; padding: 12px 16px; background: #07161df2; color: #f3dfb3; backdrop-filter: blur(10px); }
  .bar b { font: italic 600 20px var(--serif); margin-right: 8px; }
  .bar button, .bar a { font: 600 14px var(--sans); border-radius: 99px; padding: 9px 18px; cursor: pointer; text-decoration: none; }
  .bar .primary { background: #e3c27e; color: #07161d; border: 0; }
  .bar .ghost { background: transparent; color: #f3dfb3; border: 1px solid #cfa95e88; }
  .bar small { flex-basis: 100%; text-align: center; color: #a8c3c0; font-size: 12px; }

  /* pages */
  .page { width: min(210mm, 100%); min-height: 297mm; margin: 24px auto; background: var(--paper); padding: 22mm 20mm 20mm; position: relative; box-shadow: 0 10px 40px #0006; }
  .page::after { content: attr(data-folio); position: absolute; bottom: 10mm; left: 0; right: 0; text-align: center; font: italic 500 10pt var(--serif); color: var(--muted); }
  @media (max-width: 800px) { .page { min-height: 0; margin: 12px auto; padding: 28px 20px; } }
  .kicker { font: 700 8pt var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
  .chap { display: flex; align-items: baseline; gap: 14px; border-bottom: 1px solid var(--gold-soft); padding-bottom: 10px; margin-bottom: 18px; }
  .chap .rn { font: italic 500 40pt/1 var(--serif); color: var(--gold-soft); }
  .chap h2 { font-size: 30pt; }
  h3 { font-size: 18pt; margin: 18px 0 6px; }
  h4 { font: 700 8pt var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin: 12px 0 4px; }
  p { margin: 0 0 8px; }
  .muted { color: var(--muted); }
  .cols { columns: 2; column-gap: 9mm; }
  .cols > * { break-inside: avoid; }
  @media (max-width: 700px) { .cols { columns: 1; } }
  .item { break-inside: avoid; padding: 8px 0 10px; border-top: 1px solid var(--line); }
  .item:first-child { border-top: 0; }
  .item b.t { font: italic 600 15pt var(--serif); display: block; }
  .meta { font: 600 8pt var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 2px 0 6px; }
  .ev { font-size: 9pt; color: var(--muted); }
  .dots { color: var(--gold); letter-spacing: 2px; font-size: 9pt; }
  table { width: 100%; border-collapse: collapse; font-size: 9.5pt; margin: 6px 0 12px; }
  th, td { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { font: 700 7.5pt var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .note { border-left: 2px solid var(--gold-soft); padding: 6px 12px; background: #f3ecdf; font-size: 10pt; margin: 10px 0; break-inside: avoid; }
  .flow { color: var(--flow); } .tension { color: var(--tension); } .blend { color: var(--blend); }

  /* cover */
  .cover { background: radial-gradient(90% 60% at 70% 20%, #1d4a50 0%, transparent 60%), linear-gradient(180deg, #040f14, #0b2a31); color: #f4eee3; display: flex; flex-direction: column; justify-content: space-between; }
  .cover::after { display: none; }
  .cover .kicker { color: #e3c27e; }
  .cover h1 { font: italic 500 72pt/.9 var(--serif); margin: 14px 0 8px; background: linear-gradient(100deg, #fff4dc, #f6d9df 40%, #d9d2f4 65%, #bfe7df); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .cover .tag { font: italic 500 17pt/1.3 var(--serif); color: #f3dfb3; max-width: 120mm; }
  .cover .wheel { width: 120mm; max-width: 100%; margin: 10mm auto; }
  .cover .wheel svg, .wheelbox svg { width: 100%; height: auto; display: block; }
  .b3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: #cfa95e55; border: 1px solid #cfa95e55; }
  .b3 div { background: #07161d; padding: 10px 12px; }
  .b3 small { display: block; font: 700 7pt var(--sans); letter-spacing: .18em; text-transform: uppercase; color: #9fc1bc; }
  .b3 b { font: italic 600 18pt var(--serif); color: #fbf3e2; }
  .cover .foot { font-size: 8.5pt; color: #a8c3c0; }

  .toc li { display: flex; justify-content: space-between; border-bottom: 1px dotted var(--line); padding: 5px 0; font: italic 500 14pt var(--serif); }
  .toc li span { font: 500 9pt var(--sans); color: var(--muted); }
  .glance { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0 14px; }
  .glance div { border: 1px solid var(--line); padding: 8px 10px; break-inside: avoid; }
  .glance small { display: block; font: 700 7pt var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .glance b { font: italic 600 14pt var(--serif); }
  @media (max-width: 700px) { .glance { grid-template-columns: 1fr 1fr; } .b3 { grid-template-columns: 1fr; } }
  .five li { font: italic 500 14pt/1.35 var(--serif); margin-bottom: 6px; }
  .five .ev { font: 400 9pt var(--sans); font-style: normal; display: block; }
  .bars div { display: grid; grid-template-columns: 38mm 1fr 8mm; gap: 8px; align-items: center; font-size: 9pt; }
  .bars i { display: inline-block; width: 7%; height: 9px; margin-right: 2px; background: #e5dccb; border-radius: 2px; }
  .bars i.on { background: var(--gold-soft); }
  .wheelbox { width: 115mm; max-width: 100%; margin: 6mm auto; }

  @media print {
    @page { size: A4; margin: 0; }
    body { background: none; }
    .bar { display: none; }
    .page { margin: 0; box-shadow: none; width: 210mm; min-height: 297mm; break-after: page; page-break-after: always; }
    .page:last-child { break-after: auto; }
    a { color: inherit; text-decoration: none; }
  }
</style>
</head>
<body>
<div class="bar">
  <b>Charted</b>
  <button class="primary" id="save">Save as PDF ↓</button>
  <a class="ghost" href="./">Back to the chart</a>
  <small>Choose "Save as PDF" as the destination in the dialog that opens. Everything is generated on your device.</small>
</div>
<div id="report"><div class="page"><p class="muted">Preparing your report…</p></div></div>
<script src="assets/core.js"></script>
<script src="assets/report.js"></script>
</body>
</html>
